version: "3.8"

services:
  app:
    build: .
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tbot
      POSTGRES_USER: tbot
      POSTGRES_PASSWORD: tbot_secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tbot"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
