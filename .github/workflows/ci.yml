name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tbot_test
          POSTGRES_USER: tbot
          POSTGRES_PASSWORD: tbot_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U tbot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v3

      - name: Detekt
        run: ./gradlew detekt

      - name: Build
        run: ./gradlew build

      - name: Test
        run: ./gradlew test
        env:
          DB_URL: jdbc:postgresql://localhost:5432/tbot_test
          DB_USER: tbot
          DB_PASSWORD: tbot_secret
